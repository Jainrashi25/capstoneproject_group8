services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting Compose}
      MYSQL_DATABASE: waste_assistant
      MYSQL_USER: capstone
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD before starting Compose}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1 FROM regions LIMIT 1"']
      interval: 2s
      timeout: 5s
      retries: 30
  web:
    build: .
    environment:
      HOST: 0.0.0.0
      MYSQL_HOST: db
      MYSQL_DATABASE: waste_assistant
      MYSQL_USER: capstone
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD before starting Compose}
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
